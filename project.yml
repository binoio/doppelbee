name: DuoBee
options:
  bundleIdPrefix: io.bino
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en

packages:
  # Pinned exactly: `from:` would silently drift across releases, and the
  # appcast signing scheme makes an unexpected Sparkle bump expensive to undo.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.5

targets:
  DuoBee:
    type: application
    platform: macOS
    sources:
      - DuoBee/Sources
    dependencies:
      - package: Sparkle
        product: Sparkle
    preBuildScripts:
      - script: |
          # Copy app icon to Resources folder in app bundle
          mkdir -p "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources"
          cp "${SRCROOT}/DuoBee/Resources/AppIcon.icns" "${BUILT_PRODUCTS_DIR}/${PRODUCT_NAME}.app/Contents/Resources/"
        name: Copy App Icon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bino.duobee
        INFOPLIST_FILE: DuoBee/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DuoBee/Resources/DuoBee.entitlements
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  DuoBeeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - DuoBee/Tests
    dependencies:
      - target: DuoBee
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.bino.duobee.tests
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
